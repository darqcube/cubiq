# ---------------------------------------------------------------------------
# GROUP: mcp — the tool surface an AI platform uses.
#
# Seven containers from ONE image. MCP_SERVER selects the module, PORT the port.
#
# OPTIONAL BY DESIGN. Drop `mcp` from COMPOSE_PROFILES and nothing else in the
# stack loses a feature — Grafana, Prometheus, Loki and the automation API are
# all still usable directly. Nothing depends on these servers.
#
# Published on MCP_BIND_IP, which defaults to 127.0.0.1: reachable from this
# host only, exactly as unexposed as before. An ai-platform on ANOTHER machine
# needs MCP_BIND_IP set to this host's address on the network it can route to
# (site.yml ai_platform.publish) — then MCP_ALLOWED_HOSTS must name it too, and
# install.py derives both. docs/how-to/connect-an-ai-platform.md
# ---------------------------------------------------------------------------

x-mcp: &mcp
  build:
    context: ../mcp
  image: darqcube/mcp:local
  profiles: [mcp]
  labels:
    com.darqcube.group: mcp
    com.darqcube.role: mcp
  networks: [darqcube]
  restart: unless-stopped
  volumes:
    - /etc/localtime:/etc/localtime:ro   # the host's time zone, not UTC (docs/administration/time-zone.md)
    - /etc/timezone:/etc/timezone:ro

x-mcp-env: &mcp-env
  # This Cubiq's version (install.py, from the checkout's tag), reported at /version.
  CUBIQ_VERSION: ${CUBIQ_VERSION:-unknown}
  # The read token, and the execute token (stage, commit, rollback): two secrets.
  MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?set in .env}
  MCP_EXECUTE_TOKEN: ${MCP_EXECUTE_TOKEN:-}
  # token (the shared secrets) | oidc (the caller's own JWT) | both
  MCP_AUTH_MODE: ${MCP_AUTH_MODE:-token}
  # The connected platforms (agenticops.yml platforms:, JSON from install.py): a token's issuer picks one.
  MCP_OIDC_PLATFORMS: ${MCP_OIDC_PLATFORMS:-}
  # Host headers accepted besides loopback and the compose name (421 otherwise).
  MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
  MCP_MAX_RESPONSE_BYTES: ${MCP_MAX_RESPONSE_BYTES:-524288}

x-mcp-health: &mcp-health
  test: ["CMD-SHELL", "python -c \"import os,urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:'+os.environ['PORT']+'/healthz').status==200 else 1)\""]
  interval: 20s
  timeout: 5s
  retries: 10
  start_period: 15s

services:

  mcp-infrahub:
    <<: *mcp
    environment:
      <<: *mcp-env
      MCP_SERVER: infrahub
      PORT: "9001"
      INFRAHUB_URL: http://infrahub-server:8000
      INFRAHUB_API_TOKEN: ${INFRAHUB_ADMIN_TOKEN:?set in .env}
    expose: ["9001"]
    ports: ["${MCP_BIND_IP:-127.0.0.1}:9001:9001"]
    healthcheck: *mcp-health

  mcp-prometheus:
    <<: *mcp
    environment:
      <<: *mcp-env
      MCP_SERVER: prometheus
      PORT: "9002"
      PROMETHEUS_URL: http://prometheus:9090
    expose: ["9002"]
    ports: ["${MCP_BIND_IP:-127.0.0.1}:9002:9002"]
    healthcheck: *mcp-health

  mcp-loki:
    <<: *mcp
    environment:
      <<: *mcp-env
      MCP_SERVER: loki
      PORT: "9003"
      LOKI_URL: http://loki:3100
    expose: ["9003"]
    ports: ["${MCP_BIND_IP:-127.0.0.1}:9003:9003"]
    healthcheck: *mcp-health

  mcp-grafana:
    <<: *mcp
    environment:
      <<: *mcp-env
      MCP_SERVER: grafana
      PORT: "9004"
      GRAFANA_URL: http://grafana:3000
      GRAFANA_USER: ${GRAFANA_ADMIN_USER:-admin}
      GRAFANA_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in .env}
      # How a person reaches Grafana, for the links this server hands out.
      GRAFANA_PUBLIC_URL: ${GRAFANA_PUBLIC_URL:-}
      # Graphs in chat (ai_platform.graphs): render_interface_graph is
      # registered only when true — absent from tools/list otherwise.
      MCP_GRAPHS_ENABLED: ${MCP_GRAPHS_ENABLED:-false}
      # How a person's browser reaches THIS server, for image links.
      MCP_IMAGE_BASE_URL: ${MCP_IMAGE_BASE_URL:-}
      MCP_IMAGE_TTL_SECONDS: ${MCP_IMAGE_TTL_SECONDS:-900}
      MCP_GRAPH_TZ: ${MCP_GRAPH_TZ:-UTC}
      # Renders queue here for this many slots — the same number as Grafana's
      # GF_RENDERING_CONCURRENT_RENDER_REQUEST_LIMIT (observability.yaml), so
      # Grafana never reaches its limit (test_render pins the two together).
      MCP_RENDER_LIMIT: "4"
      # The numbers behind a graph, for its text summary.
      PROMETHEUS_URL: http://prometheus:9090
    expose: ["9004"]
    ports: ["${MCP_BIND_IP:-127.0.0.1}:9004:9004"]
    healthcheck: *mcp-health

  mcp-netmiko:
    <<: *mcp
    environment:
      <<: *mcp-env
      MCP_SERVER: netmiko
      PORT: "9005"
      AUTOMATION_URL: http://automation:8100
      # false (the default) means the change tools are NOT REGISTERED — absent
      # from tools/list entirely, not merely refused. True: they are, for callers
      # with the execute scope. docs/how-to/run-changes.md
      MCP_ALLOW_WRITE: ${MCP_ALLOW_WRITE:-false}
    expose: ["9005"]
    ports: ["${MCP_BIND_IP:-127.0.0.1}:9005:9005"]
    healthcheck: *mcp-health

  mcp-assurance:
    <<: *mcp
    environment:
      <<: *mcp-env
      MCP_SERVER: assurance
      PORT: "9006"
      AUTOMATION_URL: http://automation:8100
    expose: ["9006"]
    ports: ["${MCP_BIND_IP:-127.0.0.1}:9006:9006"]
    healthcheck: *mcp-health

  mcp-pyats:
    <<: *mcp
    environment:
      <<: *mcp-env
      MCP_SERVER: pyats
      PORT: "9007"
      AUTOMATION_URL: http://automation:8100
    expose: ["9007"]
    ports: ["${MCP_BIND_IP:-127.0.0.1}:9007:9007"]
    healthcheck: *mcp-health
