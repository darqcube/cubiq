# ---------------------------------------------------------------------------
# Syslog -> parse -> enrich from the source of truth -> Loki
#
# Logstash owns syslog in this stack; Telegraf owns SNMP, gNMI and flow. The
# split is deliberate: syslog from three vendors is a parsing problem, and the
# translate filter below gives a real enrichment stage that reads the same
# Infrahub-derived identity table Telegraf uses.
# ---------------------------------------------------------------------------

input {
  udp {
    port => 514
    type => "syslog"

    # 8 MiB. REQUIRES net.core.rmem_max >= 8388608 on the HOST: the kernel
    # silently clamps a larger request, and stock Ubuntu ships 212992 (208 KiB)
    # — a 40x reduction that shows up only as dropped syslog under load, with
    # no error anywhere. scripts/preflight.sh and install.py check this.
    receive_buffer_bytes => 8388608

    # More receive threads: one thread cannot keep up with a few hundred
    # devices all logging during the same network event.
    workers => 4
  }

  # Same port, TCP. UDP has no retransmit: a datagram lost anywhere between
  # device and VM is gone with no error on either side, and bursts (a login is
  # 3-4 lines in one millisecond) are what gets lost on a congested or virtual
  # path. Over TCP the device retransmits instead. IOS frames syslog over TCP
  # one message per line, in the same format as UDP, so every grok pattern
  # below applies unchanged.
  tcp {
    port => 514
    type => "syslog"
    codec => line
  }
}

filter {
  # --- 1. Parse ------------------------------------------------------------
  # Patterns are tried in order and the first match wins, so the specific
  # vendor formats come before the catch-all. ANY_SYSLOG at the end means an
  # unrecognised line is still delivered rather than silently dropped — which
  # is what a stricter parser would do, and is the failure mode that wastes
  # the most time because nothing reports it.
  grok {
    patterns_dir => ["/usr/share/logstash/patterns"]
    match => {
      "message" => [
        "%{CISCO_SYSLOG}",
        "%{VRP_SYSLOG}",
        "%{ROS_SYSLOG}",
        "%{ROS_SYSLOG_NOHOST}",
        "%{ANY_SYSLOG}"
      ]
    }
    tag_on_failure => ["_grokparsefailure"]
  }

  # --- 1b. Event time -------------------------------------------------------
  # Loki files each line under @timestamp, which Logstash sets on ARRIVAL. A
  # line that arrives late — TCP retransmitting across a lossy path, a device
  # buffering while the collector was down — is then shown at the wrong time
  # and missed by a search over the window it actually happened in.
  #
  # Use the device's own timestamp instead, but only when it is trustworthy:
  #   - it names its zone (Cisco "UTC"/"GMT", Huawei "+05:00"). RouterOS sends
  #     local time with no zone, so it keeps the arrival time;
  #   - it lies within 30 min before / 5 min after arrival. Loki rejects a
  #     line ~1h older than its stream's newest, and one ~10 min in the
  #     future, so this stays well inside both. Outside it the clock is wrong
  #     (unsynced, wrong zone) — keep the arrival time and tag clock_skew, so
  #     a bad clock is findable rather than misfiling the line.
  if [ts] and ([tz] in ["UTC", "GMT"] or [ts] =~ /[+-]\d\d:\d\d$/) {
    mutate { copy => { "ts" => "[@metadata][ts]" } }
    mutate { gsub => ["[@metadata][ts]", "\s+", " "] }
    date {
      match => ["[@metadata][ts]", "MMM d HH:mm:ss.SSS", "MMM d HH:mm:ss", "MMM d yyyy HH:mm:ssZZ"]
      timezone => "UTC"
      locale => "en"
      target => "[@metadata][device_time]"
      tag_on_failure => ["_device_time_unparsed"]
    }
    ruby {
      code => '
        dt = event.get("[@metadata][device_time]")
        if dt
          delta = dt.to_f - event.get("@timestamp").to_f
          if delta >= -1800 && delta <= 300
            event.set("@timestamp", dt)
          else
            event.tag("clock_skew")
          end
        end
      '
    }
  }

  # --- 2. Severity ---------------------------------------------------------
  # Cisco and Huawei carry severity in the message body; RouterOS does not, so
  # it is derived from the PRI (pri = facility * 8 + severity).
  if [severity_code] {
    mutate { add_field => { "severity_num" => "%{severity_code}" } }
  } else if [pri] {
    ruby { code => "event.set('severity_num', (event.get('pri').to_i % 8).to_s)" }
  }

  translate {
    source => "[severity_num]"
    target => "[severity]"
    dictionary => {
      "0" => "emergency"
      "1" => "alert"
      "2" => "critical"
      "3" => "error"
      "4" => "warning"
      "5" => "notice"
      "6" => "info"
      "7" => "debug"
    }
    fallback => "unknown"
  }

  # --- 3. Enrich from the source of truth ----------------------------------
  # THIS IS THE INTERCONNECT. devices.yml is written by render-inventory.py
  # from Infrahub, and Telegraf reads the same table. It is why a log line and
  # a metric for the same device arrive with the same device/site/role labels.
  #
  # refresh_interval means `make render` propagates without a restart.
  # Match on the hostname the device sent; fall back to its source IP, which
  # covers a device whose hostname does not match its Infrahub name.
  #
  # The UDP input puts the sender in [host][ip]; the TCP input only in
  # @metadata. Copy it across so the fallback works for both transports.
  if ![host][ip] and [@metadata][input][tcp][source][ip] {
    mutate { copy => { "[@metadata][input][tcp][source][ip]" => "[host][ip]" } }
  }
  translate {
    source => "[hostname]"
    target => "[sot]"
    dictionary_path => "/usr/share/logstash/lookup/devices.yml"
    refresh_interval => 60
    fallback => ""
  }
  if ![sot] or [sot] == "" {
    translate {
      source => "[host][ip]"
      target => "[sot]"
      # The hostname lookup above already wrote its fallback "" to [sot], and
      # translate never replaces an existing target by default — without this
      # the by-IP match was silently discarded and the fallback never worked.
      override => true
      dictionary_path => "/usr/share/logstash/lookup/devices.yml"
      refresh_interval => 60
      fallback => ""
    }
  }

  if [sot] and [sot] != "" {
    dissect {
      mapping => { "[sot]" => "%{device}|%{site}|%{role}|%{platform}" }
    }
  } else {
    # Reaching here means a device is sending logs but is NOT in Infrahub. The
    # log is kept — with the tag, so it is findable — because discarding it
    # would hide exactly the situation worth knowing about.
    # The catch-all pattern captures no hostname, so fall back explicitly
    # rather than leaving a literal "%{[hostname]}" as the device name.
    if ![hostname] {
      mutate { add_field => { "hostname" => "unparsed" } }
    }
    mutate {
      add_field => {
        "device"   => "%{[hostname]}"
        "site"     => "unknown"
        "role"     => "unknown"
        "platform" => "unknown"
      }
      add_tag => ["not_in_source_of_truth"]
    }
  }

  # --- 4. The stored line ---------------------------------------------------
  # Loki stores ONE field as the log line (message_field below). Sending only
  # `msg` threw the mnemonic away: it is neither a label nor in the line, so
  # `{device="router1"} |= "CONFIG_I"` could never match. Rebuild the line in each
  # vendor's own notation — what an engineer copies off the console and
  # searches for — with the mnemonic as searchable content, not a label.
  if [msg] {
    if [vrp_ver] {
      mutate { add_field => { "line" => "%{facility}/%{severity_code}/%{mnemonic}: %{msg}" } }
    } else if [mnemonic] {
      mutate { add_field => { "line" => "%%{facility}-%{severity_code}-%{mnemonic}: %{msg}" } }
    } else if [topics] {
      mutate { add_field => { "line" => "%{topics}: %{msg}" } }
    } else {
      mutate { add_field => { "line" => "%{msg}" } }
    }
  }

  # --- 4b. Alerts in seconds ------------------------------------------------
  # The router says a link or a neighbour went down the second it happens. Polling notices it a poll later, and its
  # alert waits for its `for` (minutes) so a flap pages nobody. These lines raise the SAME alerts at once, labelled
  # source=syslog, straight to Alertmanager (output below; its own route sends them without a group wait), and the
  # matching "up" line resolves them. Polled alerts stay: they confirm, and catch what syslog misses (a router that
  # stops sending, a lost datagram). Whether to act at once or wait for a flap is the receiving platform's policy.
  #   InterfaceDown     %LINEPROTO-5-UPDOWN: Line protocol on Interface X, changed state to down|up
  #   BGPPeerDown       %BGP-5-ADJCHANGE: neighbor A Down …|Up
  #   OSPFNeighborDown  %OSPF-5-ADJCHG: Process N, Nbr R on X from S to DOWN|FULL, …
  # Not faults, so no alert, as the polled rules: an interface an administrator shut (IOS logs LINK-5-CHANGED
  # "administratively down" just before its line-protocol down: remembered 60 s per device and interface), and a BGP
  # neighbour shut or deleted in the configuration. Interface names are shortened as SNMP's ifName (Ethernet0/1 ->
  # Et0/1), so the alerts carry the labels the polled ones do. Only devices in the source of truth.
  # Each "down" is its own episode (label `episode`: the down line's time), resolved by its own "up" line: a fault that
  # comes back is a new alert to Alertmanager, never the repeat of one it already notified. Without it, a device whose
  # alerts cleared during a silence (their resolve is never notified) had its next fault held back as "already
  # notified" until the repeat interval: an hour of a device unseen right after its maintenance. Open episodes are
  # remembered as long as an alert lives (15 minutes); after a Logstash restart an "up" line finds none, and the
  # alert ends by itself.
  if [mnemonic] and [msg] and [device] and "not_in_source_of_truth" not in [tags] {
    ruby {
      init => '
        require "json"
        require "time"
        @short_names = [["HundredGigE", "Hu"], ["FortyGigabitEthernet", "Fo"], ["TwentyFiveGigE", "Twe"],
                        ["TenGigabitEthernet", "Te"], ["GigabitEthernet", "Gi"], ["FastEthernet", "Fa"],
                        ["Ethernet", "Et"], ["Port-channel", "Po"], ["Loopback", "Lo"], ["Tunnel", "Tu"],
                        ["Vlan", "Vl"], ["Serial", "Se"]]
        @admin_shut = {}
        @admin_lock = Mutex.new
        @episodes = {}
        @firing_for = 900   # seconds: no "up" line seen (a lost datagram), the alert ends; the polled one stays
        @short = lambda do |name|
          hit = @short_names.find { |long, _| name.start_with?(long) }
          hit ? hit[1] + name[hit[0].length..-1] : name
        end
      '
      code => '
        fac, mn, msg, dev = event.get("facility").to_s, event.get("mnemonic").to_s, event.get("msg").to_s, event.get("device").to_s
        at = event.get("@timestamp").time
        labels = nil; firing = nil; summary = nil
        if fac == "LINK" && mn == "CHANGED" && msg =~ /Interface (\S+), changed state to administratively down/
          name = @short.call($1)
          @admin_lock.synchronize { @admin_shut[[dev, name]] = at.to_f; @admin_shut.delete_if { |_, t| at.to_f - t > 60 } }
        elsif fac == "LINEPROTO" && mn == "UPDOWN" && msg =~ /Line protocol on Interface (\S+), changed state to (up|down)/
          ifn, state = @short.call($1), $2
          shut = @admin_lock.synchronize { t = @admin_shut[[dev, ifn]]; t && at.to_f - t <= 60 }
          unless state == "down" && shut
            labels = {"alertname" => "InterfaceDown", "device" => dev, "ifName" => ifn, "severity" => "warning"}
            firing, summary = state == "down", "#{dev} #{ifn} is down"
          end
        elsif fac == "BGP" && mn == "ADJCHANGE" && msg =~ /neighbor \*?(\S+)(?: vpn vrf \S+)? (Up|Down)\b(.*)/
          peer, state, why = $1, $2, $3
          unless state == "Down" && why =~ /Admin\. shutdown|Neighbor deleted/
            labels = {"alertname" => "BGPPeerDown", "device" => dev, "peer" => peer, "severity" => "critical"}
            firing, summary = state == "Down", "BGP peer #{peer} on #{dev} is not established"
          end
        elsif fac == "OSPF" && mn == "ADJCHG" && msg =~ /Nbr (\S+) on (\S+) from \S+ to (\S+),/
          rid, ifn, to = $1, @short.call($2), $3
          if to == "DOWN" || to == "FULL"
            labels = {"alertname" => "OSPFNeighborDown", "device" => dev, "router_id" => rid, "ifName" => ifn,
                      "severity" => "critical"}
            firing, summary = to == "DOWN", "OSPF neighbour #{rid} on #{dev} #{ifn} is down"
          end
        end
        if labels
          labels["source"] = "syslog"
          fault = labels.values_at("alertname", "device", "ifName", "peer", "router_id").join("|")
          episode = @admin_lock.synchronize do
            @episodes.delete_if { |_, e| at.to_f - e[1] > @firing_for }
            if firing
              stamp = at.utc.iso8601(3)
              @episodes[fault] = [stamp, at.to_f]
              stamp
            else
              (@episodes.delete(fault) || [])[0]
            end
          end
          labels["episode"] = episode if episode
          ends = firing ? at + @firing_for : at
          event.set("alert_body", JSON.generate([{"labels" => labels,
            "annotations" => {"summary" => summary, "description" => event.get("line").to_s},
            "startsAt" => at.utc.iso8601(3), "endsAt" => ends.utc.iso8601(3)}]))
          event.set("alert_state", firing ? "firing" : "resolved")
        end
      '
    }
  }

  # --- 5. Trim -------------------------------------------------------------
  mutate {
    remove_field => ["sot", "severity_num", "severity_code", "pri", "seq",
                     "tz", "vrp_ver", "vrp_type", "type", "host", "event",
                     "@version", "message"]
  }
}

output {
  # Step 4b's alerts, the moment the line arrives (Alertmanager's API; retried by the plugin on failure).
  if [alert_body] {
    http {
      url => "${ALERTMANAGER_URL:http://alertmanager:9093}/api/v2/alerts"
      http_method => "post"
      content_type => "application/json"
      format => "message"
      message => "%{alert_body}"
    }
  }
  loki {
    url => "${LOKI_URL}"

    # LABEL DISCIPLINE — the single most important line in this file.
    # Only bounded, low-cardinality fields become Loki labels. `mnemonic`,
    # `topics` and the message body stay as content, searched with LogQL |=.
    # Promoting a mnemonic to a label multiplies stream count by the number of
    # distinct message types a device can emit, which makes Loki unusable at a
    # scale where it is too late to fix cheaply.
    include_fields => ["device", "site", "role", "severity", "platform"]

    message_field => "line"
    batch_wait => 1
    batch_size => 102400
  }
}
